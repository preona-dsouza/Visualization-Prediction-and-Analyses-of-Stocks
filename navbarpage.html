<!DOCTYPE html>
<html>
<head>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --secondary-color: #151226;
  --contrast-color: #7e087e;
}
.overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  height: 100%;
  z-index: -10;
  background-color: var(--contrast-color);
}

.container {
  display: flex;
  height: 100vh;
  justify-content: space-around;
  align-items: center;
  color: #fff;
  animation: expand .8s ease forwards;
  background-color: var(--secondary-color);
  position: relative;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  transition: all .8s ease;
}

.container_content {
 width: 60%;
}

.container_content_inner {
  width: 80%;
  margin-left: 80px;
}

.container_outer_img {
  margin: 10px;
  width: 50%;
  overflow: hidden;
}   
    
.container_img {
  width: 100%;
  animation: slideIn 1.5s ease-in-out forwards;
}

.par {
  height:fit-content;
  overflow: hidden;
}

p{
  line-height: 28px;
  transform: translateY(300px);
  animation: slideUp .8s ease-in-out forwards .8s;
}

.btns {
  height: 100%;
  position: relative;
  width: 550px;
  overflow: hidden;
}
.btns_more{
    display:block;
    width:400px;
    padding:16px 20px;
    margin-top:20px;

    text-align:center;
    text-decoration:none;

    background:#7e087e;
    color:#fff;

    border:2px solid #7e087e;
    border-radius:50px;

    font-size:20px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(126,8,126,.35),
        inset 0 2px 4px rgba(255,255,255,.25);

    position:relative;
    overflow:hidden;

    transition:all .35s ease;

    transform:translateY(50px);
    animation:slideUp .8s ease-in-out forwards 1s;
}

/* Shine effect */
.btns_more::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:40%;
    height:100%;
    background:rgba(255,255,255,.35);
    transform:skewX(-25deg);
    transition:.6s;
}

.btns_more:hover::before{
    left:140%;
}

.btns_more:hover{
    transform:translateY(-4px) scale(1.03);
    box-shadow:
        0 0 20px rgba(126,8,126,.7),
        0 10px 25px rgba(126,8,126,.4);
}

.btns_more a{
    color:#fff;
    text-decoration:none;
    display:block;
    width:100%;
    height:100%;
}

.title {
  overflow: hidden;
  height: auto;
}

h1 {
    font-size: 40px;
    color: var(--contrast-color);
    margin-bottom: 20px;
    transform: translateY(100px);
    animation: slideUp .8s ease forwards .5s;
}
.btn-12 span {
  display: block;
  position: absolute;
  width: 130px;
  height: 40px;
  border: 1px solid #0bf4f3;
  box-shadow: 0 0 5px #0bf4f3, 0 0 5px #0bf4f3 inset;
  margin:0;
  text-align: center;
  -webkit-box-sizing: border-box;
  -moz-box-sizing: border-box;
  box-sizing: border-box;
  -webkit-transition: all .3s;
  transition: all .3s;
}
.btn-12 span:nth-child(1) {
  box-shadow: 0 0 5px #0bf4f3, 0 0 5px #0bf4f3 inset;
  -webkit-transform: rotateX(90deg);
  -moz-transform: rotateX(90deg);
  transform: rotateX(90deg);
  -webkit-transform-origin: 50% 50% -20px;
  -moz-transform-origin: 50% 50% -20px;
  transform-origin: 50% 50% -20px;
}
.btn-12 span:nth-child(2) {
  -webkit-transform: rotateX(0deg);
  -moz-transform: rotateX(0deg);
  transform: rotateX(0deg);
  -webkit-transform-origin: 50% 50% -20px;
  -moz-transform-origin: 50% 50% -20px;
  transform-origin: 50% 50% -20px;
}
.btn-12:hover span:nth-child(1) {
  -webkit-transform: rotateX(0deg);
  -moz-transform: rotateX(0deg);
  transform: rotateX(0deg);
}
.btn-12:hover span:nth-child(2) {
  background: #000;
  color: #000;
  box-shadow: 0 0 5px #0bf4f3, 0 0 5px #0bf4f3 inset;
  -webkit-transform: rotateX(-90deg);
  -moz-transform: rotateX(-90deg);
  transform: rotateX(-90deg);
}



@keyframes slideIn {
  0% {
    transform: translateX(500px) scale(.2);
  }
  100% {
    transform: translateX(0px) scale(1);
  }
}

@keyframes slideUp {
  0% {
    transform: translateY(300px);
  }
  100% {
    transform: translateY(0px);
  }
}

@keyframes expand {
  0% {
    transform: translateX(1400px);
  }
  100% {
    transform: translateX(0px);
  }
}

  </style>
</head>
<body>

   
    
 
    <div class= 'container'>
        <div class="container_content">
        <div class="container_content_inner">
        <div class="title">
          <h1>STOCK VISUALIZATION AND PREDICTION ANALYSIS DASHBOARD
            
          </h1>
        </div>
        <div class="par">
        
        </div>
        <div class="btns">
        <button class='btns_more'><a href="http://127.0.0.1:8050/" > VISUALIZATION</a> </button>
        <button class='btns_more'><a href="http://localhost:8501"> PREDICTION </a> </button>
        <button class='btns_more'><a href="http://localhost:8502/" > ANALYSIS </a> </button>
        
        </div>
        </div>
        </div>
         <div class="container_outer_img">
         <div class="img-inner">
         <img src='1393720.jpg'  alt="" class="container_img"/>
               </div>
             </div>
          </div>
        <div class="overlay">


 
</div>

</body>
</html>
